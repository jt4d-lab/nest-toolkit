name: Publish libraries

on:
    push:
        tags:
            - 'v*.*.*'
    workflow_dispatch:

concurrency:
    group: npm-publish
    cancel-in-progress: false

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: yarn

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Prepare package versions
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  REF_NAME: ${{ github.ref_name }}
                  RUN_ID: ${{ github.run_id }}
                  REPOSITORY_URL: https://github.com/${{ github.repository }}
                  PACKAGE_LIST: ${{ runner.temp }}/packages-to-publish
              run: |
                  if [[ "$EVENT_NAME" == 'push' ]]; then
                      node tools/prepare-release.mjs \
                          --mode stable \
                          --version "${REF_NAME#v}" \
                          --repository "$REPOSITORY_URL" \
                          --output "$PACKAGE_LIST"
                  else
                      node tools/prepare-release.mjs \
                          --mode canary \
                          --run-id "$RUN_ID" \
                          --repository "$REPOSITORY_URL" \
                          --output "$PACKAGE_LIST"
                  fi

            - name: Lint
              run: yarn lint:check

            - name: Test
              run: yarn test

            - name: Build
              run: yarn build

            - name: Update npm
              run: npm install --global npm@^11.6.0

            - name: Stage packages
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  PACKAGE_LIST: ${{ runner.temp }}/packages-to-publish
                  STAGE_LOG: ${{ runner.temp }}/staged-packages.log
              run: |
                  set -euo pipefail

                  if [[ "$EVENT_NAME" == 'push' ]]; then
                      dist_tag=latest
                  else
                      dist_tag=canary
                  fi

                  : > "$STAGE_LOG"

                  while IFS= read -r package_dir; do
                      npm stage publish "./$package_dir" \
                          --access public \
                          --provenance \
                          --registry https://registry.npmjs.org \
                          --tag "$dist_tag" | tee -a "$STAGE_LOG"
                  done < "$PACKAGE_LIST"

                  {
                      echo "## Release staged for approval (dist-tag: $dist_tag)"
                      echo
                      echo 'Ни один пакет ещё не опубликован: они лежат в staging и недоступны потребителям.'
                      echo
                      echo 'Проверить: `npm stage list`, `npm stage view <stage-id>`,'
                      echo '`npm stage download <stage-id>` (нужен npm@11.6.0+).'
                      echo
                      echo 'Опубликовать: `npm stage approve <stage-id>` с 2FA.'
                      echo 'Отклонить: `npm stage reject <stage-id>` (тоже 2FA).'
                      echo
                      echo '```'
                      staged_lines="$(sed -nE 's/^\+ (.+)@([^@ ]+) \(staged with id [^)]+\)[[:space:]]*$/"\1": "\2",/p' "$STAGE_LOG")"
                      if [[ -n "$staged_lines" ]]; then
                          printf '%s\n' "$staged_lines"
                      else
                          cat "$STAGE_LOG"
                      fi
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
